name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: baxodirmamatvaliev-del
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=EC4899,8B5CF6,6366F1&color_dots=161b22,f472b6,c084fc,818cf8,ec4899
            dist/github-contribution-grid-snake-dark.svg?color_snake=EC4899,8B5CF6,6366F1&color_dots=0d1117,f472b6,c084fc,818cf8,ec4899

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
